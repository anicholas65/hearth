{% extends "base.html" %}{% block title %}Documents{% endblock %}{% block content %}
<h1>Documents</h1>
<section class="card"><form class="form" method="post" action="/documents" enctype="multipart/form-data">
<label>File<input type="file" name="file" required></label><label>Title<input name="title" placeholder="Home insurance policy"></label>
<label>Item<select name="item_id"><option value="">—</option>{% for i in items %}<option value="{{ i.id }}">{{ i.name }}</option>{% endfor %}</select></label><button>Upload</button></form></section>
<section class="card"><table><tr><th>Title</th><th>Item</th><th>Uploaded</th><th></th></tr>
{% for d in docs %}<tr><td><a href="/documents/{{ d.id }}/file" target="_blank">{{ d.title }}</a><br><span class="muted">{{ d.filename }}</span></td>
<td>{% if d.item_id %}<a href="/items/{{ d.item_id }}">{{ d.item_name }}</a>{% endif %}</td><td class="muted">{{ d.uploaded_at[:10] }}</td>
<td><form class="inline" method="post" action="/documents/{{ d.id }}/delete" onsubmit="return confirm('Delete document?')"><button class="danger sm">Delete</button></form></td></tr>
{% else %}<tr><td colspan="4" class="muted">No documents.</td></tr>{% endfor %}</table></section>
{% endblock %}
