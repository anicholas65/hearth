<label>Name<input name="name" value="{{ item.name if item else '' }}" required></label>
<label>Room<select name="room_id"><option value="">—</option>{% for r in rooms %}<option value="{{ r.id }}" {{ 'selected' if item and item.room_id == r.id or (not item and room == r.id) }}>{{ r.name }}</option>{% endfor %}</select></label>
<label>Brand<input name="brand" value="{{ item.brand or '' if item else '' }}"></label>
<label>Model<input name="model" value="{{ item.model or '' if item else '' }}"></label>
<label>Serial #<input name="serial" value="{{ item.serial or '' if item else '' }}"></label>
<label>Purchased<input name="purchase_date" type="date" value="{{ item.purchase_date or '' if item else '' }}"></label>
<label>Price<input name="price" type="number" step="0.01" value="{{ item.price or '' if item else '' }}"></label>
<label>Warranty until<input name="warranty_until" type="date" value="{{ item.warranty_until or '' if item else '' }}"></label>
<label>Expected life (yrs)<input name="life_years" type="number" min="1" value="{{ item.life_years or '' if item else '' }}"></label>
<label>Replacement cost<input name="replace_cost" type="number" step="0.01" value="{{ item.replace_cost or '' if item else '' }}"></label>
<label style="grid-column:1/-1">Notes<textarea name="notes" rows="2">{{ item.notes or '' if item else '' }}</textarea></label>
