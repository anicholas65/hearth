{% extends "_auth.html" %}{% block title %}Sign in{% endblock %}{% block content %}
<h1>Sign in</h1>
{% if error %}<p class="auth-err" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="stack">
<input type="hidden" name="next" value="{{ next }}">
<label>Username<input name="username" value="{{ username }}" autocomplete="username" autocapitalize="none" spellcheck="false" required {{ 'autofocus' if not username }}></label>
<label>Password<input type="password" name="password" autocomplete="current-password" required {{ 'autofocus' if username }}></label>
<button class="wide">Sign in</button>
</form>
<p class="muted small" style="margin:14px 0 0">Forgot it? An owner can set a new one in Settings → Accounts.</p>
{% endblock %}
