<label>Name<input name="name" required value="{{ v.name if v else '' }}" placeholder="Family Outback"></label>
<div class="form"><label>Year<input name="year" type="number" inputmode="numeric" value="{{ (v.year or '') if v else '' }}"></label>
<label>Make<input name="make" value="{{ (v.make or '') if v else '' }}"></label><label>Model<input name="model" value="{{ (v.model or '') if v else '' }}"></label></div>
<div class="form"><label>Odometer (mi)<input name="odometer" type="number" inputmode="numeric" value="{{ (v.odometer or '') if v else '' }}"></label>
<label>Plate<input name="plate" value="{{ (v.plate or '') if v else '' }}"></label></div>
<details class="more"><summary>More</summary><div class="form">
<label>VIN<input name="vin" value="{{ (v.vin or '') if v else '' }}"></label><label>Purchased<input name="purchase_date" type="date" value="{{ (v.purchase_date or '') if v else '' }}"></label>
<label>Odometer at purchase<input name="purchase_odometer" type="number" value="{{ (v.purchase_odometer or '') if v else '' }}"></label><label>Price<input name="price" type="number" step="0.01" value="{{ v.price|n if v else '' }}"></label>
<label class="wide">Notes<textarea name="notes" rows="2">{{ (v.notes or '') if v else '' }}</textarea></label></div></details>
